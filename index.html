<script>
/* منع التكبير والتصغير (iOS يتجاهل user-scalable لذا تُمنع الإيماءات برمجياً) */
(function () {
  var stop = function (e) { e.preventDefault(); };
  ["gesturestart", "gesturechange", "gestureend"].forEach(function (t) { document.addEventListener(t, stop, { passive: false }); });
  document.addEventListener("touchmove", function (e) { if ((e.scale && e.scale !== 1) || (e.touches && e.touches.length > 1)) e.preventDefault(); }, { passive: false });
  var last = 0;
  document.addEventListener("touchend", function (e) {
    var n = Date.now();
    if (n - last <= 300 && !/^(INPUT|TEXTAREA|SELECT)$/.test((e.target && e.target.tagName) || "")) e.preventDefault();
    last = n;
  }, { passive: false });
  document.addEventListener("wheel", function (e) { if (e.ctrlKey) e.preventDefault(); }, { passive: false });
})();
</script>

/* ===== بطاقة رمز الحماية ===== */
.pinc { position: relative; overflow: hidden; animation: pinIn .55s cubic-bezier(.2, .9, .3, 1) both; }
.pinc::before { content: ""; position: absolute; inset: 0 0 auto 0; height: 4px; background: linear-gradient(90deg, #94a3b8, #cbd5e1, #94a3b8); }
.pinc.on::before { background: linear-gradient(90deg, #10b981, #34d399, #0ea5e9, #10b981); background-size: 200% 100%; animation: pinBar 3.2s linear infinite; }
.pinh { display: flex; align-items: center; gap: 12px; margin: 4px 0 16px; }
.pshield { position: relative; width: 54px; height: 54px; border-radius: 18px; display: grid; place-items: center; flex: none; color: #fff; background: linear-gradient(135deg, #94a3b8, #64748b); box-shadow: 0 8px 16px rgba(0, 0, 0, .18), inset 0 1px 0 rgba(255, 255, 255, .35); animation: pinFloat 3.4s ease-in-out infinite; }

.pshield .pr1, .pshield .pr2 { position: absolute; inset: 0; border-radius: 18px; border: 2px solid rgba(52, 211, 153, .55); opacity: 0; pointer-events: none; }
.pshield.on .pr1 { animation: pinRing 2.6s ease-out infinite; }
.pshield.on .pr2 { animation: pinRing 2.6s ease-out 1.3s infinite; }
.pchk { stroke-dasharray: 1; stroke-dashoffset: 1; animation: pinDraw .7s .35s ease forwards; }
.pst { display: inline-flex; align-items: center; gap: 6px; flex: none; font-size: 12px; font-weight: 800; padding: 5px 11px; border-radius: 99px; color: #64748b; background: rgba(148, 163, 184, .16); }
.pst i { width: 7px; height: 7px; border-radius: 50%; background: currentColor; }

.pst.on i { animation: pinBlink 1.6s ease-in-out infinite; }
.pdots { display: flex; justify-content: center; gap: 14px; padding: 14px 0; margin-bottom: 14px; border-radius: 16px; background: rgba(148, 163, 184, .1); border: 1px dashed var(--bd); }
.pdots i { width: 14px; height: 14px; border-radius: 50%; border: 2px solid #94a3b8; opacity: .7; }
.pdots.on i { border-color: #10b981; background: linear-gradient(135deg, #34d399, #059669); opacity: 1; animation: pinWave 1.8s ease-in-out infinite; }
.pdots.on i:nth-child(2) { animation-delay: .15s; }
.pdots.on i:nth-child(3) { animation-delay: .3s; }
.pdots.on i:nth-child(4) { animation-delay: .45s; }
.pchs { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 14px; }
.pch { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; font-weight: 700; padding: 7px 12px; border-radius: 12px; color: var(--mut); background: rgba(148, 163, 184, .13); }

.pbtn { position: relative; overflow: hidden; width: 100%; background: linear-gradient(135deg, #10b981, #059669); box-shadow: 0 8px 18px rgba(5, 150, 105, .32); }
.pbtn::after { content: ""; position: absolute; top: 0; bottom: 0; width: 40%; left: -60%; background: linear-gradient(100deg, transparent, rgba(255, 255, 255, .45), transparent); animation: pinShine 3s ease-in-out infinite; }
@keyframes pinIn { from { opacity: 0; transform: translateY(14px) scale(.97); } }
@keyframes pinFloat { 50% { transform: translateY(-3px); } }
@keyframes pinRing { 0% { opacity: .9; transform: scale(1); } 100% { opacity: 0; transform: scale(1.55); } }
@keyframes pinDraw { to { stroke-dashoffset: 0; } }
@keyframes pinBlink { 50% { opacity: .25; transform: scale(.7); } }
@keyframes pinWave { 0%, 60%, 100% { transform: scale(1); } 30% { transform: scale(1.35); } }
@keyframes pinBar { to { background-position: 200% 0; } }
@keyframes pinPop { from { transform: scale(0); } }

@media (prefers-reduced-motion: reduce) {
  .pinc, .pinc::before, .pshield, .pshield .pr1, .pshield .pr2, .pchk, .pst i, .pdots i, .pch svg, .pbtn::after { animation: none !important; }

/* ===== ثبات الواجهة الرئيسية على الشاشات القصيرة والمتصفحات القديمة =====
   الواجهة الرئيسية مبنية لتملأ الشاشة بلا تمرير، فعندما تكون المساحة أقل من المحتاج
   (صندوق الاشتراك + شريط المتصفح + شاشة قصيرة) كانت البطاقات تنضغط والنص يخرج منها.
   الآن: لا تنكمش البطاقات عن حجم محتواها، وتتمدد كما كانت عند توفر مساحة، وتتمرر الصفحة عند الحاجة. */
body.hm { top: 0; right: 0; bottom: 0; left: 0; }

@supports not (height: 1dvh) {
  body.hm .ads { flex-basis: clamp(90px, 17vh, 140px); }

  body.hm .bigc b { font-size: clamp(17px, 2.7vh, 24px); }
  body.hm .bigc > div:last-child { font-size: clamp(13px, 2.1vh, 16px); }
  body.hm .bigc small { font-size: clamp(11px, 1.9vh, 14px); }
  .bigc .sico.l { width: clamp(52px, 9vh, 84px); height: clamp(52px, 9vh, 84px); }
}

  return [...h].map((x) => x.toString(16).padStart(2, "0")).join("");
}
async function cbKey(pass, salt, iter) {
  const km = await crypto.subtle.importKey("raw", new TextEncoder().encode(pass), "PBKDF2", false, ["deriveKey"]);
  return crypto.subtle.deriveKey({ name: "PBKDF2", salt, iterations: iter, hash: "SHA-256" }, km, { name: "AES-GCM", length: 256 }, false, ["encrypt", "decrypt"]);
}
async function cbEncrypt(text, pass, meta) {
  const salt = crypto.getRandomValues(new Uint8Array(16)), iv = crypto.getRandomValues(new Uint8Array(12)), iter = 250000;
  const key = await cbKey(pass, salt, iter);
  const ct = new Uint8Array(await crypto.subtle.encrypt({ name: "AES-GCM", iv }, key, new TextEncoder().encode(text)));
  return Object.assign({ app: "aqsat", v: 2, enc: true, iter, salt: cbB64(salt), iv: cbB64(iv), ct: cbB64(ct) }, meta);
}
async function cbDecrypt(env, pass) {
  const key = await cbKey(pass, cbUnB64(env.salt), env.iter || 250000);
  return new TextDecoder().decode(await crypto.subtle.decrypt({ name: "AES-GCM", iv: cbUnB64(env.iv) }, key, cbUnB64(env.ct)));
}

function cbAskPass(setNew) {
  return new Promise((res) => {
    const o = document.createElement("div");
    o.className = "ov";
    o.style.alignItems = "center";
    o.innerHTML = '<div class="md" style="border-radius:22px;max-width:340px;width:92%;text-align:center"><h3>🔐 كلمة سر النسخة</h3><div class="mut" style="margin-bottom:10px;font-size:13px">' + (setNew ? "اختر كلمة سر لتشفير النسخ (8 أحرف على الأقل). لا يمكن استرجاع النسخ المشفّرة إن نسيتها." : "أدخل كلمة سر النسخة المشفّرة") + '</div><input type="password" id="cbp1" autocomplete="off" style="margin-bottom:8px" placeholder="كلمة السر">' + (setNew ? '<input type="password" id="cbp2" autocomplete="off" style="margin-bottom:8px" placeholder="أعد كتابة كلمة السر">' : "") + '<div class="row"><button class="btn" id="cbok">تأكيد الكلمة</button><button class="btn ghost" id="cbno">إلغاء</button></div></div>';
    document.body.appendChild(o);
    const done = (v) => { o.remove(); res(v); };
    o.querySelector("#cbno").onclick = () => done(null);
    o.querySelector("#cbok").onclick = () => {
      const a = o.querySelector("#cbp1").value;
      if (setNew) {

        if (a !== o.querySelector("#cbp2").value) return toast("كلمتا السر غير متطابقتين");
      } else if (!a) return;

    setTimeout(() => { const i = o.querySelector("#cbp1"); if (i) i.focus(); }, 50);
  });
}

function cbLoadGis() {
  if (window.google && google.accounts && google.accounts.oauth2) return Promise.resolve(true);
  if (CB.gis) return CB.gis;
  CB.gis = new Promise((res) => {
    const s = document.createElement("script");
    s.src = "https://accounts.google.com/gsi/client";
    s.async = true;
    s.onload = () => res(!!(window.google && google.accounts && google.accounts.oauth2));
    s.onerror = () => res(false);
    document.head.appendChild(s);
  }).then((ok) => { if (!ok) CB.gis = null; return ok; });
  return CB.gis;
}
function cbToken(interactive) {
  if (CB.tok && Date.now() < CB.exp - 60000) return Promise.resolve(CB.tok);
  const id = cbGid();
  if (!id) return Promise.reject(new Error("noid"));
  const go = () => new Promise((res, rej) => {
    try {
      const c = google.accounts.oauth2.initTokenClient({
        client_id: id,
        scope: "https://www.googleapis.com/auth/drive.appdata",
        callback: (r) => {
          if (r && r.access_token) {
            CB.tok = r.access_token;
            CB.exp = Date.now() + (+r.expires_in || 3600) * 1000;
            const cfg = cbCfg();
            if (!cfg.linked) { cfg.linked = true; save(); }
            res(CB.tok);
          } else rej(new Error((r && r.error) || "auth"));
        },
        error_callback: (e) => rej(new Error((e && e.type) || "auth"))
      });
      c.requestAccessToken({ prompt: interactive && !cbCfg().linked ? "consent" : "" });
    } catch (e) { rej(e); }
  });
  // عند تحميل مكتبة Google مسبقاً نستدعيها مباشرة دون انتظار حتى لا تحجب المتصفحات (iOS) نافذة الدخول
  if (window.google && google.accounts && google.accounts.oauth2) return go();
  return cbLoadGis().then((ok) => { if (!ok) throw new Error("gis"); return go(); });
}
async function cbFetch(url, opt, inter) {
  for (let k = 0; k < 2; k++) {
    const t = await cbToken(inter !== false);
    const r = await fetch(url, Object.assign({}, opt, { headers: Object.assign({}, (opt && opt.headers) || {}, { Authorization: "Bearer " + t }) }));
    if (r.status === 401 && k === 0) { CB.tok = null; continue; }
    if (!r.ok) { const e = new Error("http" + r.status); e.status = r.status; throw e; }
    return r;
  }
}
function cbErr(e) {
  const m = String((e && e.message) || e || "");
  if (m === "noid") return "أدخل معرّف Google Client ID أولاً";
  if (m === "gis") return "تعذّر الوصول إلى خدمة Google (تحقق من الإنترنت)";
  if (/popup_closed|access_denied|popup_failed/.test(m)) return "لم يكتمل تسجيل الدخول إلى Google";
  if (e && e.status === 403) return "رفض Google الطلب: تأكد من تفعيل Drive API وصلاحية الحساب";
  if (e && e.status === 401) return "انتهت صلاحية الدخول، أعد الربط";
  if (/Failed to fetch|NetworkError|Load failed/i.test(m)) return "تعذّر الاتصال بالإنترنت";
  return "تعذّرت العملية: " + m;
}
const cbSize = (n) => { n = +n || 0; return n > 1048576 ? (n / 1048576).toFixed(1) + " MB" : Math.max(1, Math.round(n / 1024)) + " KB"; };
const DRIVE = "https://www.googleapis.com/drive/v3/files";

async function cloudList(quiet) {
  try {
    const r = await cbFetch(DRIVE + "?spaces=appDataFolder&orderBy=createdTime%20desc&pageSize=50&fields=files(id,name,size,createdTime,description)", {}, !quiet);
    CB.list = ((await r.json()).files || []).filter((f) => /^aqsat-/.test(f.name || ""));
  } catch (e) { if (!quiet) toast(cbErr(e)); }
  cbPaint();
}
async function cloudUpload(auto) {
  if (CB.busy) return;
  const cfg = cbCfg();
  if (!navigator.onLine) { if (!auto) toast("لا يوجد اتصال بالإنترنت"); return; }
  if (!auto) { // الدخول أولاً وبلمسة المستخدم مباشرة، قبل أي نافذة أخرى
    try { await cbToken(true); } catch (e) { toast(cbErr(e)); return; }
  }
  let pass = null;
  if (cfg.enc) {
    pass = CB.pass || (auto ? null : await cbAskPass(false));
    if (!pass) { if (!auto) toast("لم تُرفع النسخة: كلمة السر مطلوبة"); return; }
  }
  CB.busy = true;
  cbPaint();
  try {
    const data = snapData();
    delete data.pin;
    const sha = await cbSha(JSON.stringify(data)), ts = Date.now(), d = new Date(ts);
    let env = { app: "aqsat", v: 2, enc: false, ts, ver: APP_VER, sha, data };
    if (pass) env = await cbEncrypt(JSON.stringify({ ts, sha, data }), pass, { ts, ver: APP_VER });
    const name = "aqsat-" + today() + "_" + pad(d.getHours()) + pad(d.getMinutes()) + (pass ? ".enc.json" : ".json");
    const meta = { name, parents: ["appDataFolder"], mimeType: "application/json", description: JSON.stringify({ ts, enc: !!pass, inst: S.inst.length }) };
    const bd = "aqsat" + uid();
    const body = "--" + bd + "\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n" + JSON.stringify(meta) + "\r\n--" + bd + "\r\nContent-Type: application/json\r\n\r\n" + JSON.stringify(env) + "\r\n--" + bd + "--";
    const r = await cbFetch("https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id,name,size", { method: "POST", headers: { "Content-Type": "multipart/related; boundary=" + bd }, body }, !auto);
    const f = await r.json();
    if (pass) CB.pass = pass;
    cfg.last = { ts, id: f.id, name, enc: !!pass };
    cfg.lastAuto = today();
    LOG("رفع نسخة احتياطية إلى Google Drive");
    save();
    toast("☁️ تم رفع النسخة إلى Google Drive");
    try { // الاحتفاظ بآخر N نسخة
      const l = await (await cbFetch(DRIVE + "?spaces=appDataFolder&orderBy=createdTime%20desc&pageSize=100&fields=files(id,name)", {}, false)).json();
      const old = (l.files || []).filter((x) => /^aqsat-/.test(x.name || "")).slice(Math.max(1, +cfg.keep || 10));
      for (const x of old) await cbFetch(DRIVE + "/" + x.id, { method: "DELETE" }, false).catch(() => {});
    } catch (e) {}
    CB.busy = false;
    await cloudList(true);
  } catch (e) {
    if (!auto) toast(cbErr(e));
    else if (!CB.warned) { CB.warned = true; toast("تعذّر الرفع التلقائي، افتح «النسخة الاحتياطية» واضغط إنشاء نسخة سحابية"); }
  } finally {
    CB.busy = false;
    cbPaint();
  }
}
async function cloudRestore(id) {
  if (CB.busy) return;
  CB.busy = true;
  cbPaint();
  let inner = null;
  try {
    const env = JSON.parse(await (await cbFetch(DRIVE + "/" + encodeURIComponent(id) + "?alt=media")).text());
    if (!env || env.app !== "aqsat") throw new Error("bad");
    if (env.enc) {
      CB.busy = false;
      const pass = await cbAskPass(false);
      if (!pass) return;
      try { inner = JSON.parse(await cbDecrypt(env, pass)); CB.pass = pass; }
      catch (e) { toast("كلمة السر غير صحيحة أو الملف تالف"); return; }
    } else inner = env;
    if (inner.sha && await cbSha(JSON.stringify(inner.data)) !== inner.sha) { toast("فشل التحقق من سلامة النسخة (الملف تالف)"); return; }
    if (!validData(inner.data)) { toast("النسخة غير صالحة"); return; }
  } catch (e) {
    toast(e && e.message === "bad" ? "النسخة غير صالحة" : cbErr(e));
    return;
  } finally {
    CB.busy = false;
    cbPaint();
  }
  ask("سيتم استبدال بياناتك الحالية بهذه النسخة السحابية. متابعة؟", () => {
    const keep = { ads: S.ads, pin: S.pin, cloud: S.cloud };
    S = Object.assign(DEF(), inner.data, keep);
    LOG("استعادة نسخة من Google Drive");
    save();
    render();
    toast("تمت الاستعادة بنجاح");
  });
}
async function cloudRestoreLatest() {
  if (CB.busy) return;
  try { await cbToken(true); } catch (e) { toast(cbErr(e)); return; }
  await cloudList(true);
  if (!CB.list || !CB.list.length) { toast("لا توجد نسخ على السحابة"); return; }
  cloudRestore(CB.list[0].id);
}
function cloudDelete(id) {
  ask("حذف هذه النسخة من السحابة نهائياً؟", async () => {
    try {
      await cbFetch(DRIVE + "/" + encodeURIComponent(id), { method: "DELETE" });
      toast("تم حذف النسخة");
      await cloudList(true);
    } catch (e) { toast(cbErr(e)); }
  });
}
async function cloudConnect() {
  try {
    await cbToken(true);
    toast("تم ربط Google Drive");
    cbPaint();

function cloudDisconnect() {

    try { if (CB.tok && window.google && google.accounts) google.accounts.oauth2.revoke(CB.tok, () => {}); } catch (e) {}

function cloudSaveId() {
  const v = (document.getElementById("cbid") || {}).value || "";
  if (!/^[\w-]+\.apps\.googleusercontent\.com$/.test(v.trim())) { toast("المعرّف غير صحيح، يجب أن ينتهي بـ apps.googleusercontent.com"); return; }

async function cloudToggleEnc(on) {
  const c = cbCfg();
  if (on) {

<script>
/**
 * animations.js — حركة ظهور بطاقات الأقساط والديون عند التنقل وعند التمرير للأعلى والأسفل
 * الإعداد محفوظ في S.anim (none | fade | slide | zoom | flip | bounce | swing | stretch)
 *
 * طريقة العمل:
 *  - كل بطاقة (.card / .iw) في صفحات الأقساط والديون تُراقَب بـ IntersectionObserver.
 *  - خارج الشاشة تُخفى (an-pre)، وعند دخولها تتحرك بحسب موضعها: من الأسفل عند النزول، ومن الأعلى عند الصعود.
 *  - عند مغادرتها الشاشة تُخفى من جديد لتعيد الحركة عند عودتها (في الاتجاهين).
 *  - مسح احتياطي (animSweep) يكشف أي بطاقة بقيت مخفية داخل الشاشة، حتى لو تأخر المراقب (يحدث على iOS).
 * سكربت كلاسيكي يشترك في النطاق العام؛ يُحمَّل قبل 19-app.js.
 */
