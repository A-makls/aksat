<title>أقساطي وديوني</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f1f5f9;--card:#fff;--tx:#0f172a;--mut:#64748b;--pri:#0f766e;--pri2:#6366f1;--ok:#16a34a;--bad:#dc2626;--warn:#d97706;--bd:#e2e8f0;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b1220;--card:#162033;--tx:#e5edf8;--mut:#94a3b8;--bd:#25324a;--pri:#2dd4bf}}
:root[data-theme="dark"]{--bg:#0b1220;--card:#162033;--tx:#e5edf8;--mut:#94a3b8;--bd:#25324a;--pri:#2dd4bf}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font-family:Cairo,Tahoma,Arial,sans-serif;font-size:15px}
header{background:linear-gradient(135deg,#0f766e,#6366f1);color:#fff;padding:18px 16px 14px}
header h1{margin:0;font-size:20px}header p{margin:2px 0 0;opacity:.85;font-size:12px}



main{max-width:760px;margin:0 auto;padding:14px 12px 90px}
h2{font-size:17px;margin:4px 0 12px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:14px;margin-bottom:10px;box-shadow:0 1px 3px rgba(0,0,0,.05)}
.top{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.top b{font-size:15px}.mut{color:var(--mut);font-size:12px}
.amt{font-weight:700;white-space:nowrap}.ok{color:var(--ok)}.bad{color:var(--bad)}.warn{color:var(--warn)}
.hero{background:linear-gradient(135deg,#0f766e,#14b8a6);color:#fff;border-radius:20px;padding:18px;margin-bottom:12px}
.hero small{opacity:.85}.hero b{display:block;font-size:30px;margin-top:2px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:12px}
.st{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:12px;cursor:pointer}
.st span{font-size:22px}.st b{display:block;font-size:18px;margin-top:4px}.st small{color:var(--mut)}
.btn{background:var(--pri2);color:#fff;border:0;border-radius:12px;padding:9px 16px;font:inherit;font-size:14px;cursor:pointer}
.btn.sm{padding:5px 12px;font-size:12px;border-radius:10px}.btn.ghost{background:transparent;color:var(--tx);border:1px solid var(--bd)}
.btn.red{background:var(--bad)}.btn.grn{background:var(--ok)}
.acts{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
.bar{height:8px;background:var(--bd);border-radius:9px;overflow:hidden;margin-top:10px}.bar i{display:block;height:100%;background:linear-gradient(90deg,#14b8a6,#6366f1)}
.empty{text-align:center;color:var(--mut);padding:36px 10px}
.ov{position:fixed;inset:0;background:rgba(2,6,23,.55);display:flex;align-items:flex-end;justify-content:center;z-index:20}
.md{background:var(--card);width:100%;max-width:520px;border-radius:22px 22px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px));max-height:90vh;overflow:auto}
.md h3{margin:0 0 10px}.md label{display:block;font-size:13px;color:var(--mut);margin-bottom:10px}
input,select,textarea{width:100%;margin-top:4px;padding:10px;border-radius:10px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);font:inherit}
textarea{min-height:200px;font-family:monospace;font-size:12px;direction:ltr}
.row{display:flex;gap:8px}.row>*{flex:1}
.kv{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px dashed var(--bd)}.kv:last-child{border:0}
.tag{display:inline-block;padding:2px 9px;border-radius:99px;font-size:11px;background:var(--bd)}
.tag.r{background:#fee2e2;color:#b91c1c}.tag.g{background:#dcfce7;color:#15803d}
.wrap{overflow-x:auto}
.tb{display:flex;gap:6px;margin-bottom:12px}.tb button{width:42px;height:42px;border-radius:12px;background:var(--card);border:1px solid var(--bd);font-size:19px;cursor:pointer}
.hd{background:linear-gradient(135deg,#dbeafe,#e0e7ff,#ede9fe);color:#1e1b4b;border-radius:20px;padding:16px;margin-bottom:12px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.pill{border:1.5px solid #2563eb;color:#2563eb;border-radius:99px;padding:3px 12px;font-size:12px;white-space:nowrap}
details.sec{border-radius:18px;padding:14px;margin-bottom:10px;color:#0f172a}details.sec summary{font-weight:700;cursor:pointer;list-style:none}details.sec summary::-webkit-details-marker{display:none}
details.sec .kv{border-bottom:1px solid rgba(15,23,42,.12)}
.s1{background:#e8eefc}.s2{background:#e9f7ee}.s3{background:#fff3e0}.s4{background:#f8e8f5}
.bt{position:sticky;bottom:10px;display:flex;gap:10px;margin-top:14px}.bt a,.bt button{flex:1;padding:14px;border-radius:16px;border:0;color:#fff;font:inherit;font-weight:700;text-align:center;text-decoration:none;cursor:pointer}
header{background:#2563eb;display:flex;align-items:center;justify-content:space-between;padding:12px 16px;position:sticky;top:env(safe-area-inset-top,0px);z-index:10}header h1{font-size:18px}header button{background:none;border:0;color:#fff;font-size:24px;cursor:pointer;width:40px}

.db{background:#2f3fd8;border-radius:22px;padding:0 10px 12px;margin-bottom:14px}.dh{background:linear-gradient(135deg,#4f46e5,#6366f1);color:#fff;border-radius:22px 22px 0 0;margin:0 -10px;padding:14px 16px;display:flex;justify-content:space-between;align-items:center}.dbox{width:40px;height:40px;border-radius:12px;background:rgba(255,255,255,.22);display:inline-flex;align-items:center;justify-content:center;font-size:20px}.live{border:1px solid rgba(255,255,255,.6);border-radius:99px;padding:3px 12px;font-size:12px}
.tg{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding-top:12px}.tl{background:#f1f3f9;color:#1e293b;border-radius:22px;padding:20px 8px 16px;text-align:center;font-weight:600;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:8px;position:relative;min-height:150px;justify-content:center}.tl small{color:#64748b;font-weight:400}.tl .bg{position:absolute;top:10px;left:10px;background:#ef4444;color:#fff;border-radius:99px;padding:1px 9px;font-size:12px;font-style:normal}
.ic{width:76px;height:76px;border-radius:50%;background:conic-gradient(var(--c) 0 78%,#d3d8ee 78% 100%);display:flex;align-items:center;justify-content:center}.ic i{width:62px;height:62px;border-radius:50%;background:var(--c);display:flex;align-items:center;justify-content:center;font-style:normal;font-size:28px}
.dbn{color:#fff;border-radius:14px;padding:14px 16px;font-weight:700;font-size:18px;margin-bottom:12px}
.sm3{display:flex;border:1.5px solid #a5d6a7;border-radius:20px;padding:14px 0;margin-bottom:12px;background:var(--card)}.sm3 .c{flex:1;text-align:center;border-left:1px solid var(--bd);font-size:13px}.sm3 .c:last-child{border:0}.sm3 b{font-size:18px}
.dcard{border:1.5px solid #c8e6c9;border-radius:20px;padding:6px 16px;background:var(--card)}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%;touch-action:manipulation}input,select,textarea{font-size:16px}

<script>
const K='aqsat_app_v1';
const DEF=()=>({cust:[],emp:[],items:[],inst:[],pays:[],exps:[],debts:[],log:[],cash0:0});
let S=DEF();
try{const r=localStorage.getItem(K);if(r)S=Object.assign(DEF(),JSON.parse(r))}catch(e){}
const save=()=>{try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}};
S.inst.forEach((i,k)=>{if(!i.no)i.no=k+1});const nextNo=()=>Math.max(0,...S.inst.map(i=>+i.no||0))+1;
const uid=()=>Math.random().toString(36).slice(2,9);
const E=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const F=n=>Math.round(Number(n)||0).toLocaleString('en-US');
const today=()=>new Date().toISOString().slice(0,10);
const nm=(a,id)=>((a.find(x=>x.id===id))||{}).name||'—';
const LOG=x=>{S.log.unshift({t:new Date().toLocaleString('ar-EG'),x});S.log=S.log.slice(0,300)};
let tab='home';
const TABS=[['home','🏠','الرئيسية'],['settings','⚙️','الإعدادات'],['about','ℹ️','من نحن'],['inst','🧾','الأقساط'],['late','⏰','الأقساط المتأخرة'],['pays','💵','التسديدات'],['debts','🤝','الديون'],['stock','📦','المخزن'],['cust','👥','العملاء'],['emp','👔','الموظفون'],['exp','💸','المصروفات'],['profit','📈','الأرباح'],['stats','📊','الإحصائيات'],['cash','🏦','الصندوق'],['log','📜','سجل العمليات'],['bak','💾','النسخة الاحتياطية']];
let _pinOK=false;const go=t=>{if(t==='bak'&&S.pin&&!_pinOK){pinAsk(()=>go('bak'));return}if(t!=='bak')_pinOK=false;if(t!==tab)PREV=tab;NAV.length=0;tab=t;render();scrollTo(0,0)};

/* حسابات */
const paid=i=>S.pays.filter(p=>p.inst===i.id).reduce((a,p)=>a+p.amt,0);
const monthly=i=>i.mon>0?i.mon:(i.total-i.down)/(i.months||1)||0;
const debtIn=()=>S.debts.filter(d=>d.type==='in').reduce((a,d)=>a+d.paid,0);
const debtOut=()=>S.debts.filter(d=>d.type==='out').reduce((a,d)=>a+d.paid,0);
const sum=(a,k)=>a.reduce((x,y)=>x+(+y[k]||0),0);
const cash=()=>S.cash0+sum(S.pays,'amt')+debtIn()-sum(S.exps,'amt')-debtOut();
const profitOf=i=>i.total>0?(i.total-i.cost)*Math.min(1,paid(i)/i.total):0;
const lateList=()=>S.inst.map(i=>({i,...late(i)})).filter(x=>x.L>0).sort((a,b)=>b.days-a.days);

/* نافذة النماذج */
function openForm(title,fields,cb){
  const m=document.createElement('div');m.className='ov';
  m.innerHTML='<form class="md"><h3>'+title+'</h3>'+fields.map(f=>'<label>'+f.l+(f.t==='select'?'<select name="'+f.k+'">'+f.o.map(o=>'<option value="'+E(o[0])+'"'+(o[0]===f.v?' selected':'')+'>'+E(o[1])+'</option>').join('')+'</select>':'<input name="'+f.k+'" type="'+(f.t||'text')+'" value="'+E(f.v)+'"'+(f.t==='number'?' step="any" min="0"':'')+(f.r===0?'':' required')+'>')+'</label>').join('')+'<div class="row"><button class="btn">حفظ</button><button type="button" class="btn ghost" id="x">إلغاء</button></div></form>';
  document.body.appendChild(m);
  m.querySelector('#x').onclick=()=>m.remove();
  m.onclick=e=>{if(e.target===m)m.remove()};
  m.querySelector('form').onsubmit=e=>{e.preventDefault();const d=Object.fromEntries(new FormData(e.target));if(cb(d)===false)return;m.remove();save();render()};
}
function ask(m,cb){const o=document.createElement('div');o.className='ov';o.style.alignItems='center';o.innerHTML='<div class="md" style="border-radius:22px;max-width:340px;text-align:center"><h3>'+E(m)+'</h3><div class="row"><button class="btn red" id="y">نعم</button><button class="btn ghost" id="n">إلغاء</button></div></div>';document.body.appendChild(o);o.querySelector('#n').onclick=()=>o.remove();o.querySelector('#y').onclick=()=>{o.remove();cb()}}
function toast(m){const t=document.createElement('div');t.textContent=m;t.style.cssText='position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:#0f172a;color:#fff;padding:10px 18px;border-radius:99px;z-index:50;font-size:14px';document.body.appendChild(t);setTimeout(()=>t.remove(),2200)}
window.alert=toast;
const del=(c,id,txt)=>c==='cust'&&(S.inst.some(i=>i.cust===id)||S.debts.some(d=>d.cust===id))?toast('لا يمكن حذف عميل له أقساط أو ديون'):ask('حذف '+txt+'؟',()=>pinDel(c==='inst'||c==='debts',()=>{S[c]=S[c].filter(x=>x.id!==id);if(c==='inst')S.pays=S.pays.filter(p=>p.inst!==id);LOG('حذف '+txt);save();render()}));

/* إجراءات */
const addCust=()=>openForm('عميل جديد',[{k:'name',l:'الاسم'},{k:'phone',l:'الهاتف (بدون مفتاح العراق، مثل 07701234567)',r:0}],d=>{S.cust.push({id:uid(),name:d.name,phone:d.phone});LOG('إضافة عميل: '+d.name)});
const addEmp=()=>openForm('موظف جديد',[{k:'name',l:'الاسم'},{k:'role',l:'الوظيفة',r:0},{k:'sal',l:'الراتب الشهري',t:'number'}],d=>{S.emp.push({id:uid(),name:d.name,role:d.role,sal:+d.sal});LOG('إضافة موظف: '+d.name)});
const payEmp=id=>{const e=S.emp.find(x=>x.id===id);ask('صرف راتب '+e.name+' ('+F(e.sal)+')؟',()=>{S.exps.push({id:uid(),title:'راتب '+e.name,amt:e.sal,date:today()});LOG('صرف راتب '+e.name+': '+F(e.sal));save();render()})};
const addItem=()=>openForm('صنف جديد',[{k:'name',l:'اسم الصنف'},{k:'qty',l:'الكمية',t:'number'},{k:'cost',l:'سعر الشراء',t:'number'},{k:'price',l:'سعر البيع',t:'number'}],d=>{S.items.push({id:uid(),name:d.name,qty:+d.qty,cost:+d.cost,price:+d.price});LOG('إضافة صنف: '+d.name)});
const restock=id=>openForm('إضافة كمية',[{k:'q',l:'الكمية المضافة',t:'number'}],d=>{const it=S.items.find(x=>x.id===id);it.qty+=+d.q;LOG('توريد '+d.q+' من '+it.name)});
const addExp=()=>openForm('مصروف جديد',[{k:'title',l:'البيان'},{k:'amt',l:'المبلغ',t:'number'},{k:'date',l:'التاريخ',t:'date',v:today()}],d=>{S.exps.push({id:uid(),title:d.title,amt:+d.amt,date:d.date});LOG('مصروف: '+d.title+' '+F(d.amt))});

const EN=Object.entries(EN_RAW).sort((a,b)=>b[0].length-a[0].length);
const trS=t=>{let r=t;for(const [a,b] of EN)if(r.includes(a))r=r.split(a).join(b);return r};
function trNode(n){if(n.nodeType===3){if(n.__ar===undefined&&n.nodeValue.trim()){const v=trS(n.nodeValue);if(v!==n.nodeValue){n.__ar=n.nodeValue;n.nodeValue=v}}}}
function trAll(root){if(!root)return;if(root.nodeType===3){trNode(root);return}if(root.nodeType!==1)return;const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT,{acceptNode:n=>/^(SCRIPT|STYLE|TEXTAREA)$/.test(n.parentNode.nodeName)?NodeFilter.FILTER_REJECT:NodeFilter.FILTER_ACCEPT});let n;while(n=w.nextNode())trNode(n);
 root.querySelectorAll('[placeholder],[aria-label]').forEach(e=>{['placeholder','aria-label'].forEach(a=>{if(!e.hasAttribute(a))return;const k='data-ar-'+a,cur=e.getAttribute(a),o=e.getAttribute(k);if(o!==null&&cur===trS(o))return;const v=trS(cur);if(v!==cur){e.setAttribute(k,cur);e.setAttribute(a,v)}else if(o!==null)e.removeAttribute(k)})})}
function trRestore(){const w=document.createTreeWalker(document.body,NodeFilter.SHOW_TEXT);let n;while(n=w.nextNode())if(n.__ar!==undefined){n.nodeValue=n.__ar;n.__ar=undefined}document.querySelectorAll('[data-ar-placeholder],[data-ar-aria-label]').forEach(e=>{['placeholder','aria-label'].forEach(a=>{const k='data-ar-'+a;if(e.hasAttribute(k)){e.setAttribute(a,e.getAttribute(k));e.removeAttribute(k)}})})}
function applyLang(){const en=S.lang==='en',r=document.documentElement;r.lang=en?'en':'ar';r.dir=en?'ltr':'rtl'}
function postLang(){applyLang();if(S.lang==='en')trAll(document.body)}
function setLang(l){const prev=S.lang==='en';S.lang=l;save();applyLang();if(prev&&l!=='en')trRestore();render()}
new MutationObserver(ms=>{if(S.lang!=='en')return;ms.forEach(m=>m.addedNodes.forEach(n=>trAll(n)))}).observe(document.body,{childList:true,subtree:true});

const ER=new RegExp('('+Object.keys(EMJ).join('|')+')\\uFE0F?','g'),ET=new RegExp(ER.source),SEL='button,a.btn,a.ab,.ff>i,.fc h4>span:first-child,.nb .e';
function iconize(r){const L=[];if(r.matches&&r.matches(SEL))L.push(r);if(r.querySelectorAll)r.querySelectorAll(SEL).forEach(e=>L.push(e));L.forEach(e=>{if(ET.test(e.innerHTML))e.innerHTML=e.innerHTML.replace(ER,(m,k)=>'<svg class="ei'+(k==='➡'?' fl':'')+'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">'+EMJ[k]+'</svg>')})}
new MutationObserver(ms=>ms.forEach(m=>m.addedNodes.forEach(n=>{if(n.nodeType===1)iconize(n)}))).observe(document.body,{childList:true,subtree:true});
iconize(document.body);
const SQT=['stock','cust','emp','exp','pays','late','log','profit'],SQV={};let SQL='';
function secSearch(){
 const m=document.getElementById('main');if(!m||!SQT.includes(tab))return;
 if(SQL!==tab){SQV[tab]='';SQL=tab}
 const cards=[...m.children].filter(c=>c.classList.contains('card')&&c.querySelector(':scope>.top'));
 if(!cards.length&&!SQV[tab])return;
 const bx=document.createElement('div');bx.className='ssb';
 bx.innerHTML='<label class="ff" style="margin:0 0 12px"><i>🔍</i><input type="search" placeholder="ابحث..." autocomplete="off"><button type="button" class="cxb" style="display:none">✕</button></label>';
 const h=m.querySelector('h2');if(h)h.after(bx);else m.prepend(bx);
 const inp=bx.querySelector('input'),cx=bx.querySelector('button');inp.value=SQV[tab]||'';
 const apply=()=>{const q=inp.value.trim().toLowerCase().replace(/,/g,'');SQV[tab]=inp.value;let n=0;cards.forEach(c=>{const ok=!q||c.textContent.toLowerCase().replace(/,/g,'').includes(q);c.style.display=ok?'':'none';if(ok)n++});let e=m.querySelector('.sse');if(q&&!n){if(!e){e=document.createElement('div');e.className='empty sse';e.textContent='لا توجد نتائج مطابقة';cards[cards.length-1].after(e)}}else if(e)e.remove();cx.style.display=inp.value?'':'none'};
 inp.oninput=apply;cx.onclick=()=>{inp.value='';apply();inp.focus()};apply()}

function editCust(id){const c=S.cust.find(x=>x.id===id);if(!c)return;const ins=S.inst.filter(i=>i.cust===id);let no='',gu='';ins.slice().reverse().forEach(i=>{if(!no&&i.no)no=i.no;if(!gu&&i.guar)gu=i.guar});
 openForm('تعديل معلومات العميل',[{k:'name',l:'اسم العميل',v:c.name},{k:'phone',l:'رقم الهاتف',t:'tel',v:c.phone||'',r:0},{k:'guar',l:'الكفيل',v:gu,r:0},{k:'no',l:'رقم السجل',t:'number',v:no,r:0}],d=>{
  const nm=(d.name||'').trim();if(!nm)return false;c.name=nm;c.phone=(d.phone||'').trim();
  S.debts.forEach(x=>{if(x.cust===id){x.name=nm;x.phone=c.phone}});
  if((d.guar||'').trim()!==gu)ins.forEach(i=>i.guar=(d.guar||'').trim());
  if(d.no!==''&&+d.no!==+no)ins.forEach(i=>i.no=+d.no);
  LOG('تعديل معلومات العميل: '+nm)})}
