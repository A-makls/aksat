<style>
:root{--bg:#eaf4fd;--card:#fff;--ink:#14304f;--muted:#5f7b99;--accent:#3d86c9;--soft:#dcecfb;--line:#cfe2f5;--danger:#e0453a;--grad:linear-gradient(135deg,#62b4f2,#3d86c9);--glow:rgba(61,134,201,.35);--ad-bg:#e6e6e6;--ad-ink:#111;--dir:rtl;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
:root[data-theme=dark]{--bg:#0a1424;--card:#12233b;--ink:#e8f3ff;--muted:#8fb0d1;--accent:#5eb3f0;--soft:#173152;--line:#1f3a5f;--danger:#ff8a80;--glow:rgba(94,179,240,.3);--ad-bg:#16243a;--ad-ink:#e8f3ff}
:root[dir=ltr]{--dir:ltr}
*,*::before,*::after{box-sizing:inherit}
html,body{margin:0}
body{background:linear-gradient(180deg,var(--soft),var(--bg) 300px) var(--bg);color:var(--ink);font-family:"Tajawal",system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;font-size:17px;line-height:1.75;padding-bottom:calc(104px + env(safe-area-inset-bottom,0px));transition:background-color .4s,color .4s}
.wrap{max-width:640px;margin:0 auto;padding:0 18px}
header{padding:20px 0 4px;display:flex;align-items:center;gap:14px}
header svg{width:50px;height:50px;flex:none;color:var(--accent)}
h1{font-size:28px;font-weight:700;margin:0;line-height:1.2}
header p{margin:2px 0 0;color:var(--muted);font-size:15px}
h2{font-size:19px;font-weight:700;margin:22px 0 10px}
p{margin:0 0 12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px 18px;margin-bottom:12px;transition:background-color .4s,border-color .4s}
.key{background:var(--grad);border:0;color:#fff;font-weight:700;box-shadow:0 10px 24px var(--glow)}
.btn{display:block;width:100%;text-align:center;text-decoration:none;font:inherit;font-weight:700;padding:14px 16px;border-radius:16px;background:var(--grad);color:#fff;border:0;cursor:pointer;margin-bottom:10px;box-shadow:0 8px 18px var(--glow);transition:transform .15s}
.btn:active,.go:active{transform:scale(.97)}
.btn.alt{background:transparent;color:var(--accent);box-shadow:none;border:2px solid var(--accent)}
.go{display:block;width:100%;text-align:start;font:inherit;color:inherit;cursor:pointer;transition:transform .15s}
.go b{display:block;color:var(--accent)}
.go span,.note{color:var(--muted);font-size:15px}
.seg{display:flex;background:var(--soft);border-radius:16px;padding:4px;gap:4px}
.seg button{flex:1;border:0;background:none;font:inherit;font-weight:700;color:var(--muted);padding:10px;border-radius:12px;cursor:pointer;transition:background .25s,color .25s,box-shadow .25s}
.seg button[aria-pressed=true]{background:var(--grad);color:#fff;box-shadow:0 4px 12px var(--glow)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:8px;margin-top:14px}
.thumb{position:relative;aspect-ratio:1;border-radius:14px;overflow:hidden;background:var(--soft);animation:pop .4s cubic-bezier(.3,1.5,.5,1) both}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb button{position:absolute;inset-block-start:6px;inset-inline-start:6px;border:0;border-radius:9px;padding:2px 10px;font:inherit;font-size:14px;background:var(--card);color:var(--danger);cursor:pointer}
ol{margin:0;padding:0;list-style:none;counter-reset:s}
ol li{counter-increment:s;display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-bottom:1px solid var(--line)}
ol li:last-child{border-bottom:0}
ol li::before{content:counter(s);flex:none;width:28px;height:28px;border-radius:50%;background:var(--grad);color:#fff;font-weight:700;display:grid;place-items:center;font-size:15px;line-height:1}
.ads{margin:14px 0 4px}
.ads-view{overflow:hidden;border-radius:18px;touch-action:pan-y;background:var(--ad-bg)}
.ads-track{display:flex;transition:transform .55s cubic-bezier(.3,.7,.2,1)}
.ad{flex:0 0 100%;direction:ltr;display:flex;align-items:center;gap:8px;background:var(--ad-bg);color:var(--ad-ink);padding:12px 22px 0 0;min-height:210px;overflow:hidden}
.ad svg{width:44%;max-width:190px;height:auto;align-self:flex-end;flex:none}
.ad p{margin:0;flex:1;direction:var(--dir);font-weight:700;font-size:21px;line-height:1.7;padding-bottom:14px}
.dots{display:flex;justify-content:center;gap:8px;margin-top:9px}
.dots button{width:9px;height:9px;border-radius:5px;border:0;padding:0;background:var(--line);cursor:pointer;transition:width .3s,background .3s}
.dots button[aria-current=true]{background:var(--accent);width:24px}
nav{position:fixed;inset-inline:0;bottom:0;z-index:5;height:calc(74px + env(safe-area-inset-bottom,0px));padding-bottom:env(safe-area-inset-bottom,0px);display:grid;grid-template-columns:1fr 1fr 92px 1fr 1fr;filter:drop-shadow(0 -6px 16px var(--glow))}
nav::before{content:"";position:absolute;inset:0;background:var(--card);border-radius:28px 28px 0 0;-webkit-mask:radial-gradient(circle 46px at 50% -2px,#0000 96%,#000 100%);mask:radial-gradient(circle 46px at 50% -2px,#0000 96%,#000 100%)}
nav .tab{position:relative;border:0;background:none;font:inherit;font-size:13px;color:var(--muted);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:8px 0 0;cursor:pointer;transition:color .3s}
nav .tab svg{width:26px;height:26px;transition:transform .35s cubic-bezier(.3,1.6,.5,1)}
nav .tab[aria-current=true]{color:var(--accent);font-weight:700}
nav .tab[aria-current=true] svg{transform:translateY(-3px) scale(1.12)}
.bdg{position:absolute;top:2px;inset-inline-end:22%;min-width:20px;height:20px;padding:0 6px;border-radius:10px;background:var(--grad);color:#fff;font-style:normal;font-size:12px;font-weight:700;line-height:20px;text-align:center}
.fab{position:absolute;left:50%;top:-34px;width:68px;height:68px;margin-left:-34px;border:0;border-radius:24px;background:var(--grad);box-shadow:0 12px 26px var(--glow);cursor:pointer;display:grid;place-items:center;transition:transform .25s cubic-bezier(.3,1.6,.5,1)}
.fab:active{transform:scale(.9)}
.fab svg{width:32px;height:32px;transition:transform .7s cubic-bezier(.3,1.5,.5,1)}
.fab[aria-current=true]{transform:translateY(-3px)}
.fab[aria-current=true] svg{transform:rotate(135deg)}
a:focus-visible,button:focus-visible,label:focus-within{outline:3px solid var(--accent);outline-offset:2px}
[hidden]{display:none!important}
@keyframes up{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@keyframes pop{from{opacity:0;transform:scale(.8)}to{opacity:1;transform:none}}
.in>*{animation:up .5s cubic-bezier(.2,.8,.2,1) both}
.in>:nth-child(2){animation-delay:.07s}.in>:nth-child(3){animation-delay:.14s}.in>:nth-child(4){animation-delay:.21s}.in>:nth-child(5){animation-delay:.28s}.in>:nth-child(n+6){animation-delay:.35s}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>

const root=document.documentElement;
let lang="ar",cur="home",ai=0,timer;
try{lang=localStorage.getItem("lang")||"ar"}catch(e){}

function setLang(l){
  lang=l;root.lang=l;root.dir=l==="ar"?"rtl":"ltr";
  document.title=T[l].title;
  document.querySelectorAll("[data-i]").forEach(e=>{e.textContent=T[l][e.dataset.i]});
  document.querySelectorAll("[data-lang]").forEach(b=>b.setAttribute("aria-pressed",String(b.dataset.lang===l)));
  try{localStorage.setItem("lang",l)}catch(e){}
  adGo(ai);
  if(cur==="evidence")render();
}
function setTheme(t){
  root.dataset.theme=t;root.style.colorScheme=t;
  document.querySelectorAll("button[data-theme]").forEach(b=>b.setAttribute("aria-pressed",String(b.dataset.theme===t)));
  try{localStorage.setItem("theme",t)}catch(e){}
}
document.querySelectorAll("[data-lang]").forEach(b=>b.addEventListener("click",()=>setLang(b.dataset.lang)));
document.querySelectorAll("button[data-theme]").forEach(b=>b.addEventListener("click",()=>setTheme(b.dataset.theme)));

const navBtns=[...document.querySelectorAll("nav [data-t]")];
function show(id){
  cur=id;
  document.querySelectorAll("main section").forEach(s=>{
    const on=s.id===id;
    s.hidden=!on;
    s.classList.remove("in");
    if(on){void s.offsetWidth;s.classList.add("in")}
  });
  navBtns.forEach(b=>b.setAttribute("aria-current",String(b.dataset.t===id)));
  if(id==="evidence")render();
  window.scrollTo(0,0);
}
navBtns.forEach(b=>b.addEventListener("click",()=>show(b.dataset.t)));
document.querySelectorAll("[data-go]").forEach(b=>b.addEventListener("click",()=>show(b.dataset.go)));

let dbp;

  return dbp||(dbp=new Promise((res,rej)=>{
    const r=indexedDB.open("shield",1);
    r.onupgradeneeded=()=>r.result.createObjectStore("ev",{keyPath:"id",autoIncrement:true});
    r.onsuccess=()=>res(r.result);
    r.onerror=()=>rej(r.error);
  }));
}
async function tx(mode,fn){
  const d=await db();
  return new Promise((res,rej)=>{
    const t=d.transaction("ev",mode);
    const q=fn(t.objectStore("ev"));
    t.oncomplete=()=>res(q&&q.result);
    t.onerror=()=>rej(t.error);
  });
}
const grid=document.getElementById("grid"),msg=document.getElementById("msg"),bdg=document.getElementById("bdg");
let urls=[];
function badge(n){bdg.textContent=n;bdg.hidden=!n}
async function render(){
  urls.forEach(u=>URL.revokeObjectURL(u));urls=[];
  grid.replaceChildren();
  try{
    const items=(await tx("readonly",s=>s.getAll()))||[];
    badge(items.length);
    msg.textContent=items.length?"":T[lang].empty;
    items.reverse().forEach(it=>{
      const url=URL.createObjectURL(it.blob);urls.push(url);
      const box=document.createElement("div");box.className="thumb";
      const img=document.createElement("img");img.src=url;img.alt="";
      const del=document.createElement("button");del.textContent=T[lang].del;
      del.addEventListener("click",async()=>{
        if(confirm(T[lang].conf)){await tx("readwrite",s=>s.delete(it.id));render()}
      });
      box.append(img,del);grid.append(box);
    });
  }catch(e){msg.textContent=T[lang].e1}
}
document.getElementById("pick").addEventListener("change",async e=>{
  const files=[...e.target.files];
  try{for(const f of files)await tx("readwrite",s=>s.add({blob:f,t:Date.now()}))}
  catch(err){msg.textContent=T[lang].e2;return}
  e.target.value="";
  render();
});
tx("readonly",s=>s.count()).then(badge).catch(()=>{});

const track=document.getElementById("adTrack"),dots=[...document.querySelectorAll(".dots button")],n=dots.length;
function adGo(k){
  ai=(k+n)%n;
  track.style.transform="translateX("+(root.dir==="rtl"?1:-1)*ai*100+"%)";
  dots.forEach((d,j)=>d.setAttribute("aria-current",String(j===ai)));
}
function adStop(){clearInterval(timer)}
function adStart(){
  adStop();
  if(matchMedia("(prefers-reduced-motion:reduce)").matches)return;
  timer=setInterval(()=>adGo(ai+1),5000);
}
dots.forEach((d,j)=>d.addEventListener("click",()=>{adGo(j);adStart()}));
const view=document.querySelector(".ads-view");
let x0=null;
view.addEventListener("pointerdown",e=>{x0=e.clientX;adStop()});
view.addEventListener("pointerup",e=>{
  if(x0!==null){const dx=e.clientX-x0;if(Math.abs(dx)>40){const next=root.dir==="rtl"?dx<0:dx>0;adGo(next?ai+1:ai-1)}x0=null}
  adStart();
});
view.addEventListener("pointercancel",()=>{x0=null;adStart()});

setTheme(root.dataset.theme);
setLang(lang);
show("home");
adStart();
</script>
